data:
  source: california        # california | synthetic (california auto-falls back to synthetic if offline)
  cache_path: data/housing.csv
  test_size: 0.2
  random_state: 42

model:
  type: hist_gb             # hist_gb | random_forest | ridge
  params:
    hist_gb:
      max_iter: 300
      learning_rate: 0.1
      random_state: 42
    random_forest:
      n_estimators: 200
      n_jobs: -1
      random_state: 42
    ridge:
      alpha: 1.0

artifacts:
  model_path: models/model.joblib
  metrics_path: models/metrics.json

quality_gate:
  min_r2: 0.60              # training "fails" (exit code 1) if test R2 is below this
